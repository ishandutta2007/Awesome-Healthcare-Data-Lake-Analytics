<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Dark Healthcare Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Cyan/Teal Gradient for Healthcare Lines -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }

    /* Animated background pulse/flow elements */
    @keyframes pulseLine {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-15px) scale(1.15); opacity: 0.8; }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.08); }
      30% { transform: scale(1); }
      45% { transform: scale(1.05); }
    }

    .pulse-path {
      stroke-dasharray: 20 10;
      animation: pulseLine 25s linear infinite;
    }
    .p1 { animation: floatParticle 6s ease-in-out infinite; }
    .p2 { animation: floatParticle 8s ease-in-out infinite 2s; }
    .p3 { animation: floatParticle 7s ease-in-out infinite 4s; }
    .pulse-heart { transform-origin: 1050px 175px; animation: heartbeat 3s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGradient)"/>

  <!-- Grid Pattern overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none"/>
    </pattern>
    <rect width="1200" height="350" fill="url(#grid)"/>
  </g>

  <!-- Dynamic Animated Background Data Waves & ECG Lines (Behind Text) -->
  <g opacity="0.4">
    <!-- Wave 1 -->
    <path d="M -50 280 Q 200 180 450 250 T 950 200 T 1250 260" fill="none" stroke="url(#cyanGlow)" stroke-width="3" class="pulse-path"/>
    <!-- Wave 2 -->
    <path d="M -50 120 Q 300 240 600 150 T 1100 220 T 1250 140" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Floating Data Nodes / Particles (Background Dynamic Aspects) -->
  <g class="p1">
    <circle cx="200" cy="80" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="850" cy="100" r="6" fill="#818cf8" filter="url(#glow)"/>
  </g>
  <g class="p2">
    <circle cx="1000" cy="280" r="5" fill="#34d399" filter="url(#glow)"/>
    <circle cx="150" cy="290" r="7" fill="#60a5fa" filter="url(#glow)"/>
  </g>
  <g class="p3">
    <circle cx="500" cy="60" r="4" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="700" cy="300" r="5" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Right Decorative Healthcare Data Pulse Graphic -->
  <g class="pulse-heart" filter="url(#glow)">
    <!-- ECG / Heartbeat Line Background Graphic -->
    <path d="M 900 175 L 940 175 L 950 140 L 965 210 L 980 120 L 995 190 L 1010 165 L 1025 175 L 1120 175" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Glowing Cross Icon -->
    <g transform="translate(1050, 100)">
      <rect x="-12" y="-35" width="24" height="70" rx="6" fill="#06b6d4" opacity="0.8"/>
      <rect x="-35" y="-12" width="70" height="24" rx="6" fill="#06b6d4" opacity="0.8"/>
    </g>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed Unhidden & Ultra Legible) -->
  <!-- Tag / Pillar Badge -->
  <g transform="translate(80, 65)">
    <rect width="320" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="16" y="22" class="badge-text">🏥 HEALTHCARE DATA &amp; ANALYTICS</text>
  </g>

  <!-- Title -->
  <text x="80" y="150" class="title">Awesome Healthcare Data Lake</text>
  <text x="80" y="198" class="title" fill="url(#accentGrad)">&amp; Clinical Analytics</text>

  <!-- Subtitle -->
  <text x="80" y="250" class="subtitle">FHIR Interoperability • PHI De-identification • OMOP CDM • Clinical Data Lakes</text>

  <!-- Bottom Accent Line -->
  <rect x="80" y="285" width="450" height="4" rx="2" fill="url(#cyanGlow)"/>
</svg>
